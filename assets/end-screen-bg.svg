<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#55774f"/>
      <stop offset="0.48" stop-color="#3f6547"/>
      <stop offset="1" stop-color="#294936"/>
    </radialGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)" filter="url(#grain)"/>
  <ellipse cx="540" cy="1580" rx="390" ry="155" fill="#183626" opacity="0.18"/>
  <rect x="1.5" y="1.5" width="1077" height="1917" fill="none" stroke="#d8c783" stroke-opacity="0.16" stroke-width="3"/>
</svg>
