<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#153d2c" />
  <title>Granado | Jardim Sensorial</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stageViewport">
  <main id="stage" aria-label="Game Jardim Sensorial Granado">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="sun-ray ray-a"></div>
    <div class="sun-ray ray-b"></div>
    <div id="gardenBack" class="garden-layer garden-back"></div>
    <div id="gardenMid" class="garden-layer garden-mid"></div>
    <canvas id="gameCanvas" width="1080" height="1920" aria-label="Área do jogo"></canvas>
    <div id="gardenFront" class="garden-layer garden-front"></div>
    <div class="floor-glow"></div>

    <section id="startScreen" class="screen active">
      <div class="brand-lockup">
        <div class="brand">GRANADO</div>
        <div class="city">RIO DE JANEIRO</div>
      </div>
      <div class="hero-copy hero-copy-image">
        <img class="start-title-art" src="assets/start/title.png" alt="Yes, Nós Temos Banana! Jardim Sensorial. Desperte o jardim coletando notas tropicais." draggable="false" />
      </div>
      <div class="hero-product" aria-hidden="true">
        <img class="start-perfume" src="assets/game/perfume.png" alt="" draggable="false" />
        <div class="product-shadow"></div>
      </div>
      <button id="startButton" class="primary-button start-image-button" aria-label="Jogar">
        <img src="assets/start/botao-jogar.png" alt="" draggable="false" />
      </button>
      <p class="instruction">Arraste o frasco para os lados</p>
    </section>

    <section id="gameScreen" class="screen">
      <header class="hud">
        <div class="hud-item"><span>TEMPO</span><strong id="timeValue">30</strong></div>
        <div class="hud-brand"><b>GRANADO</b><small>JARDIM SENSORIAL</small></div>
        <div class="hud-item right"><span>PONTOS</span><strong id="scoreValue">0</strong></div>
      </header>
      <div id="comboMessage" class="combo-message">ESSÊNCIA 2×</div>
      <div id="progressWrap" class="progress-wrap">
        <span>JARDIM</span>
        <div class="progress-track"><div id="progressBar"></div></div>
      </div>
    </section>

    <section id="endScreen" class="screen">
      <div class="brand-lockup compact">
        <div class="brand">GRANADO</div>
        <div class="city">RIO DE JANEIRO</div>
      </div>
      <div class="end-copy">
        <h2>Você revelou<br/>a essência tropical.</h2>
        <div class="final-score"><span>PONTUAÇÃO</span><strong id="finalScore">0</strong></div>
        <p id="endMessage">Acesse nosso QR Code e confira a supresa que temos para você!</p>
      </div>
      <div class="end-product">
        <img class="end-qrcode" src="assets/end/qrcode-granado.png" alt="QR Code Granado" draggable="false" />
      </div>
      <button id="restartButton" class="primary-button end-image-button" aria-label="Jogar novamente"><img src="assets/end/botao-jogar-novamente.png" alt="Jogar novamente" draggable="false" /></button>
      <div class="fragrance-name">YES, NÓS TEMOS BANANA!</div>
    </section>
  </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
